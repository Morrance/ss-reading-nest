name: Build Sealos image

on:
  workflow_dispatch:
  push:
    branches:
      - sealos-deploy
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - shared/**
      - server/**
      - web/**
      - .github/workflows/sealos-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/morrance/ss-reading-nest:sealos
          cache-from: type=gha
          cache-to: type=gha,mode=max
